name: Build APK

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, and build debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run tests
        shell: bash
        run: |
          # Robolectric resolves its Android runtime on first use. Retry once so a transient
          # Maven connection reset does not invalidate an otherwise healthy build.
          ./gradlew :core-engine:test :android-app:testDebugUnitTest --no-daemon || \
            ./gradlew :core-engine:test :android-app:testDebugUnitTest --no-daemon

      - name: Lint and build debug APKs
        run: ./gradlew :android-app:lintDebug :android-app:assembleDebug --no-daemon

      - name: Verify packaged model and notices
        shell: bash
        run: |
          mapfile -t apks < <(find android-app/build/outputs/apk/debug -type f -name '*.apk' | sort)
          test "${#apks[@]}" -eq 4
          for apk in "${apks[@]}"; do
            test "$(unzip -Z1 "$apk" | grep -c '^docquad/docquadnet256_trained_opset17.ort$')" -eq 1
            unzip -Z1 "$apk" | grep -qx 'THIRD_PARTY_NOTICES.txt'
            unzip -Z1 "$apk" | grep -qx 'docquad/LICENSE.txt'
            unzip -Z1 "$apk" | grep -qx 'docquad/NOTICE.txt'
          done

  release:
    name: Build and publish signed release APKs
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      OSCAN_KEYSTORE_BASE64: ${{ secrets.OSCAN_KEYSTORE_BASE64 }}
      OSCAN_KEYSTORE_PASSWORD: ${{ secrets.OSCAN_KEYSTORE_PASSWORD }}
      OSCAN_KEY_ALIAS: ${{ secrets.OSCAN_KEY_ALIAS }}
      OSCAN_KEY_PASSWORD: ${{ secrets.OSCAN_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Restore release keystore
        shell: bash
        run: |
          if [[ -z "$OSCAN_KEYSTORE_BASE64" || -z "$OSCAN_KEYSTORE_PASSWORD" || -z "$OSCAN_KEY_ALIAS" || -z "$OSCAN_KEY_PASSWORD" ]]; then
            echo "Required OScan release-signing secrets are missing."
            exit 1
          fi
          OSCAN_KEYSTORE_FILE="$RUNNER_TEMP/oscan-release.jks"
          printf '%s' "$OSCAN_KEYSTORE_BASE64" | base64 --decode > "$OSCAN_KEYSTORE_FILE"
          echo "OSCAN_KEYSTORE_FILE=$OSCAN_KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Build release APKs
        run: ./gradlew :android-app:assembleRelease --no-daemon

      - name: Verify, rename, and checksum signed APKs
        shell: bash
        run: |
          mkdir release
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          mapfile -t apks < <(find android-app/build/outputs/apk/release -type f -name '*.apk' | sort)
          test "${#apks[@]}" -eq 4
          for apk in "${apks[@]}"; do
            abi="$(basename "$apk" .apk)"
            abi="${abi#android-app-}"
            abi="${abi%-release}"
            output="release/OScan-${GITHUB_REF_NAME}-${abi}.apk"
            cp "$apk" "$output"
            "$APKSIGNER" verify --verbose --print-certs "$output"
            test "$(unzip -Z1 "$output" | grep -c '^docquad/docquadnet256_trained_opset17.ort$')" -eq 1
            unzip -Z1 "$output" | grep -qx 'THIRD_PARTY_NOTICES.txt'
            (
              cd release
              sha256sum "$(basename "$output")" > "$(basename "$output").sha256"
            )
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "OScan $GITHUB_REF_NAME"
          --generate-notes

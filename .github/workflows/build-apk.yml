name: Build signed release APK

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-apk:
    name: Test and build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OSCAN_KEYSTORE_BASE64: ${{ secrets.OSCAN_KEYSTORE_BASE64 }}
      OSCAN_KEYSTORE_PASSWORD: ${{ secrets.OSCAN_KEYSTORE_PASSWORD }}
      OSCAN_KEY_ALIAS: ${{ secrets.OSCAN_KEY_ALIAS }}
      OSCAN_KEY_PASSWORD: ${{ secrets.OSCAN_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Restore release keystore
        shell: bash
        run: |
          if [[ -z "$OSCAN_KEYSTORE_BASE64" || -z "$OSCAN_KEYSTORE_PASSWORD" || -z "$OSCAN_KEY_ALIAS" || -z "$OSCAN_KEY_PASSWORD" ]]; then
            echo "Required OScan release-signing secrets are missing."
            exit 1
          fi
          OSCAN_KEYSTORE_FILE="$RUNNER_TEMP/oscan-release.jks"
          printf '%s' "$OSCAN_KEYSTORE_BASE64" | base64 --decode > "$OSCAN_KEYSTORE_FILE"
          echo "OSCAN_KEYSTORE_FILE=$OSCAN_KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Test, lint, and build release APK
        run: ./gradlew :core-engine:test :android-app:testDebugUnitTest :android-app:lintDebug :android-app:assembleRelease --no-daemon

      - name: Verify and checksum signed APK
        shell: bash
        run: |
          mkdir release
          cp android-app/build/outputs/apk/release/android-app-release.apk "release/OScan-${GITHUB_REF_NAME}.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "release/OScan-${GITHUB_REF_NAME}.apk"
          sha256sum "release/OScan-${GITHUB_REF_NAME}.apk" > "release/OScan-${GITHUB_REF_NAME}.apk.sha256"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: oscan-signed-release
          path: release/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish tagged release
    needs: build-release-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download signed APK
        uses: actions/download-artifact@v5
        with:
          name: oscan-signed-release
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "OScan $GITHUB_REF_NAME"
          --generate-notes
